name: CI

on:
  workflow_dispatch: ~
  push:
    branches:
      - 2.x
      - 3.x
  pull_request: ~

jobs:

  lint:
    name: Lint
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: 'Require Doctrine MongoDB dependencies'
        run: composer require --no-update --ignore-platform-reqs --dev --no-interaction --ansi "doctrine/mongodb-odm:^2.6" "doctrine/mongodb-odm-bundle:^5.0.0"

      - name: 'Install dependencies'
        id: deps
        run: |
          echo "::group::Install project deps"
            composer update --prefer-dist --ignore-platform-reqs --ansi
          echo "::endgroup::"
        env:
          SYMFONY_REQUIRE: "6.4*dev"

      - name: 'Lint - PHP CS Fixer'
        if: always() && steps.deps.outcome == 'success'
        run: |
          echo "::group::Install PHP CS Fixer"
            make php-cs-fixer.phar
          echo "::endgroup::"

          ./php-cs-fixer.phar fix --dry-run --no-interaction --diff

      - name: 'Lint - PHPStan'
        if: always() && steps.deps.outcome == 'success'
        run: ./vendor/bin/phpstan

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.allow-failure == 1 }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest deps
          - name: 'Test lowest deps [Linux, PHP 8.4]'
            os: 'ubuntu-latest'
            php: '8.4'
            composer-flags: '--prefer-lowest'
            allow-unstable: true
            mongodb: true

          # Previous Symfony versions

          - name: 'Test Symfony 6.4 [Linux, PHP 8.5]'
            os: 'ubuntu-latest'
            php: '8.5'
            symfony: '6.4.*@dev'
            allow-unstable: true
            mongodb: true
            mysql: true

          - name: 'Test Symfony 7.4 [Linux, PHP 8.5]'
            os: 'ubuntu-latest'
            php: '8.5'
            symfony: '7.4.*@dev'
            allow-unstable: true
            mysql: true
            mongodb: true

          # Previous PHP versions

          - name: 'Test Symfony 6.4 [Linux, PHP 8.4]'
            os: 'ubuntu-latest'
            php: '8.4'
            symfony: '6.4.*@dev'
            allow-unstable: true
            mysql: true
            mongodb: true

          - name: 'Test Symfony 7.4 [Linux, PHP 8.4]'
            os: 'ubuntu-latest'
            php: '8.4'
            symfony: '7.4.*@dev'
            allow-unstable: true
            mysql: true
            mongodb: true

          # Most recent versions

          - name: 'Test Symfony 8.0 [Linux, PHP 8.5]'
            os: 'ubuntu-latest'
            php: '8.5'
            symfony: '8.0.*@dev'
            allow-unstable: true
            mysql: true
            mongodb: true

          # Bleeding edge (unreleased dev versions where failures are allowed)
          - name: 'Test next Symfony 8.1 [Linux, PHP 8.5] (allowed failure)'
            os: 'ubuntu-latest'
            php: '8.5'
            symfony: '8.1.*@dev'
            composer-flags: '--ignore-platform-req php'
            allow-unstable: true
            allow-failure: true
            mysql: true
            mongodb: true

          - name: 'Test next Symfony 8.1 [Linux, PHP 8.6] (allowed failure)'
            os: 'ubuntu-latest'
            php: '8.6'
            symfony: '8.1.*@dev'
            composer-flags: '--ignore-platform-req php'
            allow-unstable: true
            allow-failure: true
            mysql: true
            mongodb: true

    steps:
      - name: 'Set git to use LF'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: 'Checkout'
        uses: actions/checkout@v6

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite ${{ matrix.mongodb && ', mongodb' }} ${{ matrix.mysql && ', pdo_mysql' }}
          coverage: none
          tools: 'composer:v2,flex'

      - name: 'Start MongoDB (Linux)'
        uses: supercharge/mongodb-github-action@1.10.0
        if: ${{ matrix.mongodb }}

      - name: 'Shutdown Default Ubuntu MySQL'
        run: sudo service mysql stop
        if: ${{ matrix.mysql }}

      - name: 'Setup MySQL'
        uses: ankane/setup-mysql@v1
        with:
          mysql-version: '8.0.35'
          database: doctrine_tests
        if: ${{ matrix.mysql }}

      - name: 'Get composer cache directory'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        if: ${{ matrix.os != 'windows-latest' }}

      - name: 'Cache dependencies'
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-${{ hashFiles('**/composer.json') }}-flags-${{ matrix.composer-flags }}
          restore-keys: ${{ runner.os }}-composer-
        if: ${{ matrix.os != 'windows-latest' }}

      - name: 'Allow unstable packages'
        run: composer config minimum-stability dev
        if: ${{ matrix.allow-unstable }}

      - name: 'Require Doctrine MongoDB dependencies for Symfony'
        run: composer require --no-update ${{ matrix.composer-flags }} --dev --no-interaction --ansi "doctrine/mongodb-odm:^2.6" "doctrine/mongodb-odm-bundle:^5.0.0"
        if: ${{ matrix.mongodb }}

      - name: 'Install dependencies'
        run: |
          echo "::group::Install project deps"
            composer update --prefer-dist ${{ matrix.composer-flags }} --ansi
          echo "::endgroup::"
        env:
          SYMFONY_REQUIRE: "${{ matrix.symfony }}"

      - name: 'Set Doctrine MySQL DSN (Linux)'
        run: echo "DOCTRINE_DBAL_URL=pdo-mysql://root@127.0.0.1:3306/doctrine_tests?serverVersion=8.0.35" >> $GITHUB_ENV
        if: ${{ matrix.mysql }}

      - name: 'Run PHPUnit tests'
        run: vendor/bin/phpunit --testdox
